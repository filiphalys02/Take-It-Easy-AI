<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="icon" type="image/png" sizes="128x128" href="favicon.png">
<title>Take It Easy</title>
<style>
:root{
  --bg:#0b1220; --panel:#121b2e; --edge:#24324d; --text:#e6ebf5; --muted:#8794ad;
  --gold:#fbbf24; --user:#38bdf8; --ai:#f472b6; --win:#4ade80;
  --cell:#1a2640; --cell-edge:#34466a; --tile:#f6efdc; --tile-edge:#c8bc98;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(1300px 760px at 50% -12%, #1d2d50 0%, var(--bg) 62%);
  color:var(--text); display:flex; flex-direction:column; overflow:hidden; user-select:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* ---------- nagłówek ---------- */
header{flex:none;height:7vh;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 2.2vw}
.brand{font-weight:800;letter-spacing:.2em;font-size:clamp(18px,3.2vh,32px);color:var(--gold);line-height:1}
.brand small{display:block;margin-top:.55em;font-weight:500;letter-spacing:.12em;color:var(--muted);font-size:.4em}
.hright{display:flex;align-items:center;gap:1.6vw}
.lang{display:flex;border:1px solid var(--edge);border-radius:99px;overflow:hidden;background:var(--panel)}
.lang button{cursor:pointer;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;letter-spacing:.12em;
  font-size:clamp(11px,1.7vh,15px);padding:.45em .9em;transition:background .15s,color .15s}
.lang button:hover{color:var(--text)}
.rules{color:var(--muted);text-decoration:none;font-weight:800;letter-spacing:.12em;font-size:clamp(11px,1.7vh,15px);
  border:1px solid var(--edge);border-radius:99px;padding:.45em .9em;background:var(--panel);transition:color .15s,border-color .15s}
.rules:hover{color:var(--gold);border-color:var(--gold)}
.lang button.on{background:var(--gold);color:#1b1300}
.turn{color:var(--muted);font-size:clamp(13px,2.2vh,22px);letter-spacing:.06em}
.turn b{color:var(--text);font-size:1.5em;margin:0 .15em}
/* ---------- wylosowany kafelek ---------- */
#top{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.caption{font-size:clamp(10px,1.45vh,14px);letter-spacing:.32em;color:var(--muted);text-transform:uppercase;margin-bottom:1vh}
#bigTile{height:min(24vh,17vw);min-height:90px;display:flex;align-items:center;justify-content:center}
#bigTile svg{height:100%;width:auto;filter:drop-shadow(0 .8vh 2vh rgba(251,191,36,.28))}
.finished{color:var(--gold);font-weight:800;letter-spacing:.25em;font-size:clamp(18px,3vh,30px)}
/* ---------- plansze ---------- */
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr minmax(200px,22vw) 1fr;gap:1.4vw;padding:0 2.2vw}
.panel{
  min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--edge);
  border-top:3px solid var(--accent);border-radius:20px;padding:1vh 1.3vw 1.1vh;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  transition:transform .5s cubic-bezier(.3,.8,.3,1), opacity .5s, box-shadow .25s, border-color .25s;
}
/* plansza gracza, który ma ruch, jest pełnego rozmiaru; druga się zmniejsza */
.panel:not(.turn){transform:scale(.8);opacity:.72}
body.is-over .panel{transform:none;opacity:1}
.panel.user{--accent:var(--user)} .panel.ai{--accent:var(--ai)}
.panel.turn{box-shadow:0 0 0 1px var(--accent),0 0 28px -4px var(--accent),0 10px 30px rgba(0,0,0,.35)}
.phead{flex:none;display:flex;align-items:center;justify-content:space-between;margin-bottom:.4vh}
.who{display:flex;align-items:center;gap:.7em;font-weight:800;letter-spacing:.2em;font-size:clamp(14px,2.4vh,24px)}
.who i{width:.7em;height:.7em;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.who small{display:block;font-weight:500;letter-spacing:.04em;color:var(--muted);font-size:.5em;margin-top:.3em}
.score{color:var(--gold);display:flex;align-items:baseline;gap:.3em}
.score b{font-size:clamp(22px,4.2vh,44px);font-variant-numeric:tabular-nums;line-height:1}
.score small{color:var(--muted);font-size:clamp(11px,1.6vh,15px);letter-spacing:.1em}
.boardwrap{flex:1;min-height:0;display:flex}
.boardwrap svg{width:100%;height:100%}
.chips{flex:none;min-height:5.6vh;max-height:8vh;display:flex;flex-wrap:wrap;gap:.5vh .5vw;align-content:flex-start;overflow:hidden;margin-top:.6vh}
.chip{display:inline-flex;align-items:center;gap:.35em;border:1px solid var(--c);border-radius:99px;padding:.15em .7em;font-size:clamp(10px,1.6vh,14px);color:var(--text);background:rgba(255,255,255,.03);white-space:nowrap}
.chip b{color:var(--c);font-weight:800}
.chip em{font-style:normal;color:var(--gold);font-weight:700}
.nochip{color:var(--muted);font-size:clamp(10px,1.5vh,13px);letter-spacing:.04em}
/* ---------- środek ---------- */
.center{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0}
.status{margin-top:1.6vh;min-height:9vh}
.st-title{font-weight:800;font-size:clamp(16px,3vh,30px);letter-spacing:.06em}
.st-title.user{color:var(--user)} .st-title.ai{color:var(--ai)}
.st-sub{margin-top:.8vh;color:var(--muted);font-size:clamp(11px,1.7vh,16px);line-height:1.5}
.dots span{animation:blink 1.2s infinite both}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.15}40%{opacity:1}}
.over{
  position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,460px);
  background:linear-gradient(180deg,#16233d,#0e1729);border:1px solid var(--gold);border-radius:22px;
  padding:clamp(18px,3.5vh,40px) clamp(14px,2vw,32px);
  box-shadow:0 0 0 100vmax rgba(5,10,20,.72),0 0 60px -10px rgba(251,191,36,.45),0 24px 60px rgba(0,0,0,.6);
  animation:rise .45s cubic-bezier(.2,.9,.3,1.2);
}
.over[hidden]{display:none}
@keyframes rise{from{opacity:0;transform:translate(-50%,-44%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.over-title{color:var(--muted);letter-spacing:.35em;font-size:clamp(10px,1.6vh,14px)}
.verdict{margin:1.2vh 0 2vh;font-weight:900;letter-spacing:.06em;font-size:clamp(24px,5vh,48px)}
.verdict.win{color:var(--win)} .verdict.lose{color:var(--ai)} .verdict.draw{color:var(--gold)}
.final{display:flex;justify-content:center;gap:2.2vw;margin-bottom:2.6vh}
.f{min-width:7.5em;border-radius:14px;padding:1.2vh 1em;background:rgba(255,255,255,.04);border:1px solid var(--edge)}
.f span{display:block;letter-spacing:.25em;font-size:clamp(10px,1.5vh,13px);font-weight:700}
.f b{display:block;font-size:clamp(26px,5.4vh,52px);font-variant-numeric:tabular-nums;line-height:1.1}
.f.user span{color:var(--user)} .f.ai span{color:var(--ai)}
.f.best{border-color:var(--gold);box-shadow:0 0 22px -6px var(--gold)}
button#again{
  cursor:pointer;border:0;border-radius:99px;padding:1.5vh 2.2vw;font-weight:900;letter-spacing:.14em;
  font-size:clamp(12px,2vh,18px);color:#1b1300;background:linear-gradient(180deg,#ffd45a,#f5a90f);
  box-shadow:0 8px 24px -6px rgba(251,191,36,.7);transition:transform .12s, box-shadow .12s, filter .12s;
}
button#again:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.07);box-shadow:0 12px 30px -6px rgba(251,191,36,.9)}
button#again:active{transform:scale(.98)}
/* ---------- talia ---------- */
#bottom{flex:none;height:19vh;min-height:120px;padding:1vh 2.2vw 1.4vh}
.deck{height:100%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--edge);border-radius:20px;padding:.8vh 1.3vw}
.deckhead{flex:none;display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:clamp(10px,1.5vh,14px);letter-spacing:.22em;text-transform:uppercase}
.deckhead b{color:var(--text);font-size:1.25em;letter-spacing:.05em}
.deckhead em{font-style:normal;letter-spacing:.04em;text-transform:none;font-size:.95em}
#remaining{flex:1;min-height:0;display:flex}
#remaining svg{width:100%;height:100%}
/* ---------- kafelki w SVG ---------- */
.tile-body{fill:var(--tile);stroke:var(--tile-edge);stroke-width:1.5}
.tile .num{fill:#fff;font-weight:800;text-anchor:middle;font-family:inherit}
.tile.gold .tile-body{stroke:var(--gold);stroke-width:4}
.tile.gold{filter:drop-shadow(0 0 7px rgba(251,191,36,.8))}
.lastring{fill:none;stroke-width:3.5}
.panel.user .lastring{stroke:var(--user)} .panel.ai .lastring{stroke:var(--ai)}
.empty{fill:var(--cell);stroke:var(--cell-edge);stroke-width:1.5}
.slot.active{cursor:pointer}
.slot.active .empty{stroke:rgba(56,189,248,.6);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{stroke-opacity:.35}50%{stroke-opacity:1}}
.slot.active:hover .empty,.slot.sel .empty{fill:#243660;stroke:var(--gold);animation:none}
.slot .preview{opacity:0;pointer-events:none;transition:opacity .08s}
.slot.active:hover .preview,.slot.sel .preview{opacity:.93}
.preview .tile-body{stroke:var(--gold);stroke-width:3;stroke-dasharray:7 5}
.ghost{fill:none;stroke:#1f2c47;stroke-width:1.5;stroke-dasharray:3 4}
.glabel{font-size:13px;font-weight:700;letter-spacing:.12em;text-anchor:middle}
.pop{animation:pop .38s cubic-bezier(.2,.9,.3,1.25);transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(.35);opacity:0}100%{transform:scale(1);opacity:1}}
.drop{animation:drop .5s cubic-bezier(.2,.9,.3,1.2);transform-box:fill-box;transform-origin:center}
@keyframes drop{0%{transform:translateY(-34px) rotate(-14deg) scale(.7);opacity:0}100%{transform:none;opacity:1}}
#toast{position:fixed;left:50%;bottom:3vh;transform:translateX(-50%);background:#3b1220;border:1px solid var(--ai);color:#ffd7e6;
  padding:.8em 1.4em;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:1}
button,.slot{-webkit-tap-highlight-color:transparent;touch-action:manipulation}

/* ---------- wersja mobilna: układ w jednej kolumnie, przewijana strona ---------- */
@media (max-width:820px), (max-height:600px){
  html,body{height:auto;min-height:100%}
  body{display:block;overflow-x:hidden;overflow-y:auto;-webkit-user-select:none;padding-bottom:env(safe-area-inset-bottom)}
  header{height:auto;min-height:0;flex-wrap:wrap;gap:6px 12px;padding:10px 14px}
  .brand{font-size:17px;letter-spacing:.14em}
  .brand small{font-size:9px}
  .hright{gap:10px;margin-left:auto}
  .turn{font-size:13px}
  .lang button{font-size:12px;padding:.5em .85em}
  .rules{font-size:12px;padding:.5em .85em}
  #top{height:auto;min-height:0;padding:2px 0 10px}
  .caption{font-size:10px;margin-bottom:4px}
  #bigTile{height:96px}
  .finished{font-size:20px}
  main{display:flex;flex-direction:column;gap:12px;width:100%;max-width:560px;margin:0 auto;padding:0 12px}
  .center{order:-1;min-height:0}
  .status{margin:0 0 2px;min-height:0}
  .st-title{font-size:19px}
  .st-sub{font-size:13px;margin-top:4px}
  .panel{padding:10px 12px 12px;border-radius:16px}
  .panel:not(.turn){transform:none;opacity:.85}
  .who{font-size:16px}
  .score b{font-size:30px}
  .score small{font-size:12px}
  .boardwrap{flex:none;width:100%;align-self:center;transition:width .45s cubic-bezier(.3,.8,.3,1)}
  .panel:not(.turn) .boardwrap{width:70%}
  body.is-over .panel .boardwrap{width:100%}
  .boardwrap svg{height:auto}
  .chips{min-height:0;max-height:none;margin-top:8px;gap:6px}
  .chip{font-size:12px}
  .nochip{font-size:12px}
  .over{position:fixed;width:min(92vw,420px);padding:22px 14px;box-shadow:0 0 0 100vmax rgba(5,10,20,.72),0 0 60px -10px rgba(251,191,36,.45)}
  .over-title{font-size:11px}
  .verdict{font-size:30px;margin:10px 0 16px}
  .final{gap:12px;margin-bottom:18px}
  .f{min-width:6.5em;padding:8px .8em}
  .f span{font-size:11px}
  .f b{font-size:38px}
  button#again{font-size:15px;padding:13px 24px}
  #bottom{height:auto;min-height:0;width:100%;max-width:560px;margin:0 auto;padding:12px 12px 22px}
  .deck{height:auto;padding:10px 12px;border-radius:16px}
  .deckhead{font-size:11px}
  #remaining{flex:none}
  #remaining svg{height:auto}
  .glabel{font-size:17px}
  #toast{bottom:16px;max-width:90vw;text-align:center}
}
</style>
</head>
<body>
<header>
  <div class="brand">TAKE IT EASY<small data-i18n="subtitle"></small></div>
  <div class="hright">
    <div class="turn"><span data-i18n="turn"></span> <b id="turnNum">1</b> / <span id="turnTotal">19</span></div>
    <a class="rules" id="rulesLink" target="_blank" rel="noopener noreferrer" data-i18n="rules"></a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pl">PL</button>
    </div>
  </div>
</header>

<main>
  <section class="panel user" id="panelUser">
    <div class="phead">
      <div class="who"><i></i><div><span data-i18n="you"></span><small data-i18n="clickHint"></small></div></div>
      <div class="score"><b id="scoreUser">0</b><small data-i18n="pts"></small></div>
    </div>
    <div class="boardwrap" id="boardUser"></div>
    <div class="chips" id="chipsUser"></div>
  </section>

  <section class="center">
    <div id="top">
      <div class="caption" data-i18n="drawn"></div>
      <div id="bigTile"></div>
    </div>
    <div class="status" id="status"></div>
    <div class="over" id="over" hidden>
      <div class="over-title" data-i18n="gameOver"></div>
      <div class="verdict" id="verdict"></div>
      <div class="final">
        <div class="f user" id="fUser"><span data-i18n="you"></span><b id="finalUser">0</b></div>
        <div class="f ai" id="fAi"><span data-i18n="net"></span><b id="finalAi">0</b></div>
      </div>
      <button id="again" data-i18n="playAgain"></button>
    </div>
  </section>

  <section class="panel ai" id="panelAi">
    <div class="phead">
      <div class="who"><i></i><div><span data-i18n="net"></span></div></div>
      <div class="score"><b id="scoreAi">0</b><small data-i18n="pts"></small></div>
    </div>
    <div class="boardwrap" id="boardAi"></div>
    <div class="chips" id="chipsAi"></div>
  </section>
</main>

<section id="bottom">
  <div class="deck">
    <div class="deckhead">
      <span><span data-i18n="remaining"></span> · <b id="remCount">27</b></span>
    </div>
    <div id="remaining"></div>
  </div>
</section>
<div id="toast"></div>

<script type="module">
import {VersusGame, CELLS, TILES, GROUPS, AXES} from './engine.js';

const COL = {1:'#868e96',5:'#228be6',9:'#e03131',2:'#e0a800',6:'#40c057',7:'#be4bdb',3:'#15aabf',4:'#fd7e14',8:'#7950f2'};
const SQ3 = Math.sqrt(3);
const $ = id => document.getElementById(id);
let META = null, STATE = null, busy = false, gameNo = 0, bigKey = null, selCell = null;
const TOUCH = matchMedia('(hover: none)').matches;
const prevCount = {human: 0, ai: 0};

/* ---------- język ---------- */
const I18N = {
  en: {
    subtitle: 'BOARD GAME', rules: 'RULES', turn: 'TURN', drawn: 'Drawn tile', you: 'YOU', net: 'NET', pts: 'PTS',
    clickHint: 'click an empty cell', gameOver: 'GAME OVER', playAgain: 'PLAY AGAIN', remaining: 'Remaining tiles',
    vertical: 'VERTICAL', noLines: 'no completed lines', yourMove: 'Your move',
    yourMoveHint: 'Click an empty cell on your board.<br>Hover to preview the tile.',
    yourMoveHintTouch: 'Tap an empty cell to preview the tile,<br>tap it again to place it.',
    netThinks: 'The net is thinking', netHint: 'Same tile, its own board.',
    win: d => `YOU WON! (+${d})`, lose: d => `THE NET WINS (+${d})`, draw: 'DRAW',
    netLoading: 'Loading the model (first move only)…',
    noEngine: 'The AI could not run: ',
    errors: {notYourTurn: 'It is not your turn', notNetTurn: 'The net is not to move now', cellTaken: 'This cell is taken', badCell: 'Invalid cell'},
  },
  pl: {
    subtitle: 'GRA PLANSZOWA', rules: 'ZASADY', turn: 'TURA', drawn: 'Wylosowany kafelek', you: 'TY', net: 'SIEĆ', pts: 'PKT',
    clickHint: 'kliknij wolne pole', gameOver: 'KONIEC GRY', playAgain: 'ZAGRAJ PONOWNIE', remaining: 'Pozostałe kafelki',
    vertical: 'PIONOWO', noLines: 'brak ukończonych linii', yourMove: 'Twój ruch',
    yourMoveHint: 'Kliknij wolne pole na swojej planszy.<br>Po najechaniu zobaczysz podgląd kafelka.',
    yourMoveHintTouch: 'Dotknij wolnego pola, by zobaczyć podgląd kafelka,<br>dotknij ponownie, by go położyć.',
    netThinks: 'Sieć myśli', netHint: 'Ten sam kafelek, jej własna plansza.',
    win: d => `WYGRAŁEŚ! (+${d})`, lose: d => `WYGRYWA SIEĆ (+${d})`, draw: 'REMIS',
    netLoading: 'Ładowanie modelu (tylko przy pierwszym ruchu)…',
    noEngine: 'Nie udało się uruchomić AI: ',
    errors: {notYourTurn: 'To nie jest Twoja kolej', notNetTurn: 'Sieć nie jest teraz na ruchu', cellTaken: 'To pole jest zajęte', badCell: 'Niepoprawne pole'},
  },
};
let LANG = 'en';
try { const s = localStorage.getItem('tie-lang'); if (s in I18N) LANG = s; } catch (_) {}
const t = k => I18N[LANG][k];
const RULES_URL = {
  en: 'https://en.wikipedia.org/wiki/Take_It_Easy_(game)',
  pl: 'https://pl.wikipedia.org/wiki/Take_it_Easy',
};

function applyLang() {
  document.documentElement.lang = LANG;
  $('rulesLink').href = RULES_URL[LANG];
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  if (STATE) { bigKey = null; render(); }
}

function setLang(l) {
  LANG = l;
  try { localStorage.setItem('tie-lang', l); } catch (_) {}
  applyLang();
}

/* ---------- geometria i rysowanie kafelków ---------- */
const pol = (cx, cy, r, deg) => { const a = deg * Math.PI / 180; return [cx + r * Math.cos(a), cy - r * Math.sin(a)]; };
const hexPts = (cx, cy, r) => [0,60,120,180,240,300].map(d => pol(cx, cy, r, d).map(n => n.toFixed(2)).join(',')).join(' ');

function tileSVG(tile, cx, cy, r, cls = '') {
  const vals = META.tiles[tile], inr = r * SQ3 / 2;
  let s = `<g class="tile ${cls}"><polygon class="tile-body" points="${hexPts(cx, cy, r)}"/>`;
  vals.forEach((v, d) => {            // osie: kolorowe linie przez środek, w kierunku danej liczby
    const [A, B] = META.axes[d], p1 = pol(cx, cy, inr * .97, A), p2 = pol(cx, cy, inr * .97, B);
    s += `<line x1="${p1[0].toFixed(2)}" y1="${p1[1].toFixed(2)}" x2="${p2[0].toFixed(2)}" y2="${p2[1].toFixed(2)}" stroke="${COL[v]}" stroke-width="${Math.max(1.3, r / 13).toFixed(2)}" stroke-linecap="round"/>`;
  });
  vals.forEach((v, d) => {            // plakietki z liczbami
    const [bx, by] = pol(cx, cy, r * .6, META.axes[d][0]), br = r * .27;
    s += `<circle cx="${bx.toFixed(2)}" cy="${by.toFixed(2)}" r="${br.toFixed(2)}" fill="${COL[v]}"/>` +
         `<text class="num" x="${bx.toFixed(2)}" y="${by.toFixed(2)}" dy=".35em" font-size="${(r * .47).toFixed(2)}">${v}</text>`;
  });
  return s + '</g>';
}

function bigTileSVG(tile) {
  return `<svg viewBox="-108 -94 216 188">${tileSVG(tile, 0, 0, 100, 'drop')}</svg>`;
}

function boardSVG(side, isNew) {
  const R = 50, d = STATE[side], gold = new Set();
  d.lines.forEach(l => l.cells.forEach(c => gold.add(c)));
  const W = 8 * R + 24, H = 5 * SQ3 * R + 24, active = side === 'human' && STATE.phase === 'human';
  let s = `<svg viewBox="${-W / 2} ${-H / 2} ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  META.cells.forEach(([q, r], i) => {
    const cx = 1.5 * R * q, cy = SQ3 * R * (r + q / 2), t = d.board[i];
    if (t >= 0) {
      const cls = (gold.has(i) ? 'gold ' : '') + (isNew && i === d.last ? 'pop' : '');
      s += tileSVG(t, cx, cy, R * .94, cls);
      if (i === d.last) s += `<polygon class="lastring" points="${hexPts(cx, cy, R * 1.0)}"/>`;
    } else {
      s += `<g class="slot${active ? ' active' : ''}${active && i === selCell ? ' sel' : ''}" data-cell="${i}"><polygon class="empty" points="${hexPts(cx, cy, R * .94)}"/>`;
      if (active) s += tileSVG(STATE.tile, cx, cy, R * .94, 'preview');
      s += '</g>';
    }
  });
  return s + '</svg>';
}

function remainingSVG() {
  const r = 22, cs = r * 2.15, rs = r * 1.86, gw = cs * 3, gap = 46, total = 3 * gw + 2 * gap, top = 26, H = top + 3 * rs + 6;
  const rem = new Set(STATE.remaining);
  let s = `<svg viewBox="0 0 ${total.toFixed(1)} ${H.toFixed(1)}" preserveAspectRatio="xMidYMid meet">`;
  META.groups[0].forEach((a, gi) => {
    const gx = gi * (gw + gap);
    s += `<text class="glabel" x="${(gx + gw / 2).toFixed(1)}" y="14" fill="${COL[a]}">${t('vertical')} ${a}</text>`;
    META.tiles.forEach((t, id) => {
      if (t[0] !== a) return;
      const row = META.groups[1].indexOf(t[1]), col = META.groups[2].indexOf(t[2]);
      const cx = gx + cs * (col + .5), cy = top + rs * (row + .5);
      s += rem.has(id) ? tileSVG(id, cx, cy, r, 'rem') : `<polygon class="ghost" points="${hexPts(cx, cy, r)}"/>`;
    });
  });
  return s + '</svg>';
}

const chipsHTML = lines => !lines.length ? '<span class="nochip">' + t('noLines') + '</span>' :
  lines.slice().sort((a, b) => b.points - a.points).map(l =>
    `<span class="chip" style="--c:${COL[l.value]}"><b>${l.value}</b> × ${l.length} = <em>${l.points}</em></span>`).join('');

/* ---------- render ---------- */
function render() {
  const S = STATE, over = S.phase === 'over';
  $('turnNum').textContent = over ? S.total : S.turn + 1;
  $('turnTotal').textContent = S.total;

  const key = over ? 'over' : `${gameNo}:${S.turn}:${S.tile}`;
  if (key !== bigKey) { bigKey = key; $('bigTile').innerHTML = S.tile != null ? bigTileSVG(S.tile) : '<div class="finished">' + t('gameOver') + '</div>'; }

  for (const [side, suffix] of [['human', 'User'], ['ai', 'Ai']]) {
    const n = S[side].board.filter(x => x >= 0).length;
    $('board' + suffix).innerHTML = boardSVG(side, n > prevCount[side]);
    prevCount[side] = n;
    $('score' + suffix).textContent = S[side].score;
    $('chips' + suffix).innerHTML = chipsHTML(S[side].lines);
  }
  $('panelUser').classList.toggle('turn', S.phase === 'human');
  $('panelAi').classList.toggle('turn', S.phase === 'ai');

  $('remaining').innerHTML = remainingSVG();
  $('remCount').textContent = S.remaining.length;

  const st = $('status');
  if (S.phase === 'human') st.innerHTML = `<div class="st-title user">${t('yourMove')}</div><div class="st-sub">${t(TOUCH ? 'yourMoveHintTouch' : 'yourMoveHint')}</div>`;
  else if (S.phase === 'ai') st.innerHTML = `<div class="st-title ai">${t('netThinks')}<span class="dots"><span>.</span><span>.</span><span>.</span></span></div><div class="st-sub">${aiReady ? t('netHint') : t('netLoading')}</div>`;
  else st.innerHTML = '';

  $('over').hidden = !over;
  document.body.classList.toggle('is-over', over);
  if (over) {
    const h = S.human.score, a = S.ai.score, diff = Math.abs(h - a);
    const v = $('verdict');
    v.className = 'verdict ' + (S.result === 'human' ? 'win' : S.result === 'ai' ? 'lose' : 'draw');
    v.textContent = S.result === 'human' ? t('win')(diff) : S.result === 'ai' ? t('lose')(diff) : t('draw');
    $('finalUser').textContent = h; $('finalAi').textContent = a;
    $('fUser').classList.toggle('best', h >= a); $('fAi').classList.toggle('best', a >= h);
  }
}

/* ---------- gra i AI lokalnie w przeglądarce (bez serwera) ---------- */
const META_DATA = {cells: CELLS, tiles: TILES, groups: GROUPS, axes: AXES};
let game = new VersusGame();

// AI liczy w workerze (ONNX Runtime Web), żeby nie blokować interfejsu
let aiReady = false, aiError = null, reqId = 0;
const pending = new Map();
const worker = new Worker(new URL('./ai-worker.js', import.meta.url), {type: 'module'});
worker.onmessage = ev => {
  const m = ev.data;
  if (m.type === 'ready') { aiReady = true; if (STATE && STATE.phase === 'ai') render(); }
  else if (m.type === 'move') { pending.get(m.id)?.resolve(m.cell); pending.delete(m.id); }
  else if (m.type === 'error') {
    if (m.id === undefined) { aiError = m.message; pending.forEach(p => p.reject(new Error(t('noEngine') + m.message))); pending.clear(); }
    else { pending.get(m.id)?.reject(new Error(t('noEngine') + m.message)); pending.delete(m.id); }
  }
};
worker.onerror = ev => { aiError = ev.message || 'worker'; pending.forEach(p => p.reject(new Error(t('noEngine') + aiError))); pending.clear(); };

function aiThink(board, tile) {
  if (aiError) return Promise.reject(new Error(t('noEngine') + aiError));
  return new Promise((resolve, reject) => {
    const id = ++reqId;
    pending.set(id, {resolve, reject});
    worker.postMessage({type: 'choose', id, board: Array.from(board), tile});
  });
}

async function api(path, body) {
  switch (path) {
    case '/api/meta': return META_DATA;
    case '/api/state': return game.toDict();
    case '/api/new': game = new VersusGame(); return game.toDict();
    case '/api/move': game.humanMove(body.cell); return game.toDict();
    case '/api/ai-move': {
      if (game.phase !== 'ai') throw new Error('notNetTurn');
      game.aiMove(await aiThink(game.ai.board, game.tile));
      return game.toDict();
    }
  }
  throw new Error('unknown ' + path);
}
const errText = e => I18N[LANG].errors[e.message] || e.message;
const sleep = ms => new Promise(res => setTimeout(res, ms));
let toastTimer = null;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200); }

async function onCell(cell) {
  if (busy || !STATE || STATE.phase !== 'human') return;
  busy = true; selCell = null;
  try {
    STATE = await api('/api/move', {cell}); render();               // najpierw widać ruch człowieka
    if (STATE.phase === 'ai') {
      const [st] = await Promise.all([api('/api/ai-move', {}), sleep(750)]);   // min. 0,75 s "myślenia"
      STATE = st; render();
    }
  } catch (e) { toast(errText(e)); try { STATE = await api('/api/state'); render(); } catch (_) {} }
  finally { busy = false; }
}

async function newGame() {
  if (busy) return;
  busy = true;
  try { gameNo++; bigKey = null; selCell = null; prevCount.human = prevCount.ai = 0; STATE = await api('/api/new', {}); render(); }
  catch (e) { toast(errText(e)); }
  finally { busy = false; }
}

$('boardUser').addEventListener('click', e => {
  const g = e.target.closest('.slot.active');
  if (!g) return;
  const cell = +g.dataset.cell;
  if (TOUCH && cell !== selCell) { selCell = cell; render(); return; }   // dotyk: pierwszy = podgląd, drugi = ruch
  onCell(cell);
});
$('again').addEventListener('click', newGame);
document.addEventListener('keydown', e => { if (STATE && STATE.phase === 'over' && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); newGame(); } });

document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

(async function init() {
  applyLang();
  try {
    META = await api('/api/meta');
    STATE = await api('/api/state');
    prevCount.human = STATE.human.board.filter(x => x >= 0).length;
    prevCount.ai = STATE.ai.board.filter(x => x >= 0).length;
    render();
  } catch (e) { toast(errText(e)); }
})();
</script>
</body>
